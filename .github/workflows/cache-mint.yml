name: Mint Cache

# Caches saved by pull_request runs are scoped to that PR, so this warms the cache on main
# where every PR can restore it.
on:
  push:
    branches:
      - main
    paths:
      - 'Mintfile'
      - '.github/workflows/cache-mint.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  cache-mint:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Cache Mint
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Install Mint packages
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install mint
          mint bootstrap
